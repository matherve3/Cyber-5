{id:401,t:"Créer une startup cyber",d:55,
intro:"Créer une startup en cybersécurité est un défi unique : le marché est porteur (3-4 millions de postes non pourvus, demande croissante), mais la concurrence est féroce et les cycles de vente sont longs (6-18 mois dans les grandes entreprises). Il faut trouver une niche, un produit différenciant, un premier client, et un financement. En Afrique de l'Ouest, l'opportunité est énorme : la digitalisation bancaire explose, la conformité BCEAO se renforce, et peu d'acteurs locaux existent.",
analogy:"Créer une startup cyber, c'est comme ouvrir un restaurant dans une ville où il y a beaucoup de monde qui a faim mais peu de restaurants. Vous devez choisir le bon menu (niche), trouver un bon emplacement (marché), embaucher un bon chef (équipe), et avoir assez de trésorerie pour tenir les 18 premiers mois (runway).",
sections:[
{titre:"Étapes classiques d'une startup cyber",contenu:"<ol><li><b>Idée & validation</b> : identifier un problème réel (douleur client), proposer une solution, valider avec 20+ entretiens clients.</li><li><b>MVP (Minimum Viable Product)</b> : version minimale qui résout le cœur du problème, développée en 3-6 mois.</li><li><b>Premiers clients (early adopters)</b> : 3-5 clients payants qui acceptent d'essuyer les plâtres, souvent à prix réduit.</li><li><b>Product-market fit</b> : le produit est adopté naturellement, la traction est mesurable.</li><li><b>Financement</b> : bootstrapping (auto-financement), love money (famille/amis), business angels, VC.</li><li><b>Scale</b> : équipe, ventes, marketing, internationalisation.</li></ol>"},
{titre:"Niches cyber portantes en Afrique de l'Ouest",contenu:"<ul><li><b>Conformité BCEAO automatisée</b> : outils pour faciliter la conformité bancaire.</li><li><b>SOC-as-a-Service</b> : SOC externalisé pour PME/fintech.</li><li><b>Formation cyber</b> : académies, bootcamps.</li><li><b>Pentest pour fintech</b> : audit spécialisé.</li><li><b>Fraude mobile money</b> : détection IA.</li><li><b>KYC / AML</b> : outils d'identité numérique.</li><li><b>Cloud security</b> : expertise AWS/Azure.</li><li><b>Conformité RGPD/ARTCI</b> : DPO-as-a-service.</li></ul>"},
{titre:"Modèles économiques en cyber",contenu:"<table><tr><th>Modèle</th><th>Description</th><th>Exemple</th></tr><tr><td><b>SaaS</b></td><td>Abonnement mensuel/annuel</td><td>CrowdStrike</td></tr><tr><td><b>Service (MSSP)</b></td><td>Contrat de service récurrent</td><td>Orange Cyberdefense</td></tr><tr><td><b>Licence</b></td><td>Vente unique + maintenance</td><td>Beaucoup de solutions on-prem</td></tr><tr><td><b>Consulting</b></td><td>Facturation au jour-homme</td><td>Deloitte, PwC</td></tr><tr><td><b>Formation</b></td><td>Certifications, cours</td><td>SANS, Offensive Security</td></tr><tr><td><b>Bug bounty</b></td><td>Commission sur vulnérabilités</td><td>HackerOne</td></tr></table>"},
{titre:"Financement au stade early-stage",contenu:"<ul><li><b>Bootstrapping</b> : 0€ à 100k€. Vous financez vous-même, gardez 100% du capital. Idéal si revenus possibles rapidement.</li><li><b>Love money</b> : 10k€ à 100k€. Famille/amis. Simple mais peut être délicat personnellement.</li><li><b>Business angels</b> : 50k€ à 500k€. Investisseurs individuels souvent expérimentés. Réseau + mentorat.</li><li><b>VC (Venture Capital)</b> : 500k€ à 50M€+. Fonds professionnels. Prend 15-25% du capital.</li><li><b>Subventions</b> : Bpifrance (France), Fonds africains, Africa Tech Summit, Village Capital. Non-dilutif.</li><li><b>Revenue-based financing</b> : remboursement en % du CA. Peu dilutif.</li></ul>"},
{titre:"Exemples de startups cyber à succès (global)",contenu:"<ul><li><b>Wiz</b> : cloud security, créé en 2020, vendu 32 milliards $ (Google) en 2024. Croissance record.</li><li><b>SentinelOne</b> : EDR, IPO 2021.</li><li><b>CrowdStrike</b> : EDR, IPO 2019, valorisation >70 milliards $.</li><li><b>Snyk</b> : sécurité open source, valorisé 7,4 milliards $.</li><li><b>1Password</b> : gestionnaire MDP, valorisé 6,8 milliards $.</li><li><b>Axonius</b> : asset management, valorisé 2,6 milliards $.</li></ul>"}
],
why:"La création de startup = voie la plus impactante pour transformer la cybersécurité. En Afrique de l'Ouest, l'opportunité est énorme (digitalisation bancaire, conformité BCEAO).",

{id:402,t:"Business plan cyber",d:50,
intro:"Le business plan est le document qui structure votre projet de startup. Il sert à la fois pour vous (clarifier la vision) et pour convaincre investisseurs/partenaires. Un bon business plan couvre : marché, produit, équipe, concurrence, modèle économique, prévisions financières, roadmap.",
analogy:"Un business plan, c'est comme une carte routière pour un voyage de 3 ans. Vous ne pouvez pas prévoir tous les détours, mais vous savez où vous voulez aller et par où vous passez.",
sections:[
{titre:"Structure d'un business plan",contenu:"<ol><li><b>Executive summary</b> : 1 page, l'essentiel. Le pitch.</li><li><b>Problème</b> : quel problème résolvez-vous ? Pour qui ?</li><li><b>Solution</b> : votre produit/service, en quoi il est unique.</li><li><b>Marché</b> : taille (TAM/SAM/SOM), croissance, segments.</li><li><b>Modèle économique</b> : comment vous gagnez de l'argent.</li><li><b>Concurrence</b> : qui sont les acteurs, votre différenciation.</li><li><b>Go-to-market</b> : comment vous vendez (canaux, prix, vente).</li><li><b>Équipe</b> : fondateurs, compétences, recrutements prévus.</li><li><b>Roadmap</b> : 3 ans, jalons, KPI.</li><li><b>Finances</b> : prévisionnel 3 ans, besoin de financement, rentabilité.</li><li><b>Risques</b> : identification, mitigation.</li></ol>"},
{titre:"Taille du marché : TAM, SAM, SOM",contenu:"<ul><li><b>TAM</b> (Total Addressable Market) : marché total si vous aviez 100% de part. Ex : 200 milliards $ (cybersécurité mondiale).</li><li><b>SAM</b> (Serviceable Available Market) : segment que vous pouvez servir. Ex : 2 milliards $ (cybersécurité banques Afrique).</li><li><b>SOM</b> (Serviceable Obtainable Market) : ce que vous pouvez réellement conquérir en 3-5 ans. Ex : 50M$ (2,5% du SAM).</li></ul><p>Erreur fréquente : présenter le TAM comme réaliste. Les investisseurs veulent voir le SOM réaliste.</p>"},
{titre:"Prévisionnel financier",contenu:"<p>3 ans, mois par mois ou trimestre par trimestre :</p><ul><li><b>Revenus</b> : par produit, par client, par région.</li><li><b>Coûts</b> : salaires, marketing, R&D, cloud, juridique.</li><li><b>Marge brute</b> : revenus - coûts directs.</li><li><b>EBITDA</b> : marge brute - coûts opérationnels.</li><li><b>Trésorerie</b> : mois par mois (burn rate).</li><li><b>Runway</b> : combien de mois avant rupture de trésorerie.</li></ul>"},
{titre:"Erreurs à éviter",contenu:"<ul><li><b>Marché surestimé</b> : les investisseurs le verront.</li><li><b>Projections irréalistes</b> : croissance de 20%/mois pendant 3 ans.</li><li><b>Pas de concurrence</b> : il y en a toujours.</li><li><b>Équipe incomplète</b> : solo founder = red flag.</li><li><b>Pas de plan B</b> : un seul produit, un seul marché.</li><li><b>Pas de chiffres clés</b> : CAC, LTV, churn.</li></ul>"}
],

pr:["Rédiger l'executive summary","Faire le prévisionnel 3 ans","Identifier TAM/SAM/SOM","Présenter à 3 mentors"],

{id:403,t:"Pitch deck investisseurs",d:45,
intro:"Le pitch deck est le document de 10-15 slides qui présente votre startup en 5-10 minutes. C'est l'outil de vente #1 pour lever des fonds. Il doit être clair, visuel, chiffré, et raconter une histoire.",
analogy:"Un pitch deck, c'est une bande-annonce de film. En 2 minutes, vous devez donner envie d'en savoir plus.",
sections:[
{titre:"Les 10 slides essentiels",contenu:"<ol><li><b>Titre</b> : nom, tagline, logo, contact.</li><li><b>Problème</b> : douleur client, chiffres.</li><li><b>Solution</b> : votre produit, bénéfice.</li><li><b>Démo</b> : captures d'écran, vidéo.</li><li><b>Marché</b> : TAM/SAM/SOM.</li><li><b>Traction</b> : clients, revenus, croissance.</li><li><b>Modèle économique</b> : comment vous gagnez.</li><li><b>Concurrence</b> : tableau comparatif.</li><li><b>Équipe</b> : fondateurs, advisors.</li><li><b>Ask</b> : combien vous levez, pour quoi faire.</li></ol>"},
{titre:"Traction : ce que les investisseurs veulent voir",contenu:"<ul><li><b>Revenus</b> : MRR (Monthly Recurring Revenue), ARR (Annual Recurring Revenue).</li><li><b>Croissance</b> : MoM (month over month), YoY.</li><li><b>Clients</b> : nombre, logos (surtout références).</li><li><b>Rétention</b> : churn (attrition), NPS (satisfaction).</li><li><b>Unit economics</b> : CAC (coût acquisition), LTV (lifetime value), LTV/CAC > 3.</li></ul>"},
{titre:"Storytelling",contenu:"<p>Le pitch doit raconter une histoire :</p><ol><li><b>Le problème</b> : 'Les banques perdent X millions par an à cause de Y.'</li><li><b>La solution</b> : 'Nous avons créé Z qui résout ce problème.'</li><li><b>La preuve</b> : 'Nous avons N clients qui utilisent Z.'</li><li><b>La vision</b> : 'Dans 5 ans, Z sera utilisé par toutes les banques africaines.'</li></ol>"},
{titre:"Pitch deck examples",contenu:"<p>Les meilleurs pitch decks sont publics :</p><ul><li><b>Airbnb</b> (2008) : 10 slides, focus problème/solution.</li><li><b>Uber</b> (2008) : 20 slides, très visuel.</li><li><b>Wiz</b> (2020) : focus marché cloud security.</li><li><b>LinkedIn</b> (2004) : focus réseau professionnel.</li><li>Vous pouvez les trouver sur SlideShare, DocSend.</li></ul>"},
{titre:"Erreurs classiques",contenu:"<ul><li><b>Trop de texte</b> : les slides ne sont pas un document.</li><li><b>Pas de traction</b> : les investisseurs veulent des chiffres.</li><li><b>Marché surestimé</b> : perte de crédibilité.</li><li><b>Pas d'équipe</b> : solo founder = red flag.</li><li><b>Pitch trop long</b> : >15 minutes = perte d'attention.</li><li><b>Pas de démo</b> : 'show, don't tell'.</li></ul>"}
],

sections:[
{titre:"Sources de financement par stade",contenu:"<table><tr><th>Stade</th><th>Montant</th><th>Sources</th></tr><tr><td>Pre-seed</td><td>0-500k€</td><td>Bootstrapping, love money, BA</td></tr><tr><td>Seed</td><td>500k-3M€</td><td>BA, micro-VC, subventions</td></tr><tr><td>Series A</td><td>3-15M€</td><td>VC</td></tr><tr><td>Series B+</td><td>15-100M€</td><td>VC, growth equity</td></tr><tr><td>IPO/M&A</td><td>100M€+</td><td>Bourse, acquisition</td></tr></table>"},
{titre:"Business Angels (BA)",contenu:"<p>Investisseurs individuels, souvent anciens entrepreneurs ou dirigeants. Apports :</p><ul><li>50-500k€ par BA, souvent en groupe (2-10 BA).</li><li>Prend 5-15% du capital.</li><li>Apporte réseau, mentorat, expertise.</li><li>Décision rapide (semaines vs mois pour VC).</li><li>Moins de pression sur la croissance à court terme.</li></ul>"},
{titre:"Venture Capital (VC)",contenu:"<p>Fonds professionnels qui investissent dans startups à fort potentiel. Apports :</p><ul><li>500k-50M€+ par tour.</li><li>Prend 15-25% du capital.</li><li>Stratégie de sortie (IPO ou M&A) en 5-10 ans.</li><li>Expectative de croissance forte (10x en 5 ans).</li><li>Board seat, reporting mensuel.</li><li>Décision longue (3-6 mois).</li></ul>"},
{titre:"Subventions et aides",contenu:"<ul><li><b>Bpifrance</b> (France) : Bourse French Tech, Deeptech, prêts d'amorçage.</li><li><b>Horizon Europe</b> (UE) : EIC Accelerator jusqu'à 2,5M€ + 15M€ equity.</li><li><b>Africa Tech Summit</b> : pitch competitions.</li><li><b>Village Capital</b> : programme Afrique.</li><li><b>Fonds africains</b> : Norrsken22, Launch Africa, TLcom, Partech Africa.</li><li><b>BCEAO</b> : programmes d'innovation financière.</li></ul>"},
{titre:"Corporate Venture Capital (CVC)",contenu:"<p>Des grandes entreprises (Orange, BNP, Mastercard) investissent dans des startups cyber. Apports :</p><ul><li>Investissement financier + accès au marché.</li><li>Pilote avec la maison mère.</li><li>Exit potentiel (acquisition).</li><li>Mais : vision parfois moins risquée, gouvernance plus lourde.</li></ul>"},
{titre:"Dilution et gouvernance",contenu:"<p>Chaque tour de financement dilue les fondateurs. Calcul :</p><ul><li>Si vous levez 1M€ à 5M€ pre-money : post-money = 6M€, dilution = 1/6 = 16.7%.</li><li>Après Series A + B + C, les fondateurs peuvent tomber à 20-30% du capital.</li><li>Attention aux clauses : liquidation preference (1x, 2x), anti-dilution, drag-along.</li></ul>"}
],

{id:405,t:"Recruter dans une startup",d:45,
intro:"Recruter dans une startup est très différent d'une grande entreprise. Pas de RH, peu de budget, mais beaucoup d'autonomie et d'impact. Les premiers employés déterminent la culture, la vitesse, et le succès.",
analogy:"Un commando de 10 personnes. Chacun doit être autonome, polyvalent, et aligné sur la mission. Pas de place pour les passagers.",
sections:[
{titre:"Défis spécifiques startup",contenu:"<ul><li><b>Budget limité</b> : salaires 20-30% sous le marché, compensé par equity (BSPCE, stock options).</li><li><b>Polyvalence</b> : un même employé peut faire 3 métiers.</li><li><b>Instabilité</b> : risque de faillite, pivot.</li><li><b>Autonomie</b> : peu de process, décisions rapides.</li><li><b>Impact</b> : ce que vous construisez compte vraiment.</li></ul>"},
{titre:"Premiers recrutements cyber",contenu:"<ol><li><b>Cofondateur technique</b> : CTO capable de construire le produit.</li><li><b>Premier ingénieur</b> : senior, capable de tout faire (dev, ops, sécurité).</li><li><b>Premier commercial</b> : capable de vendre à des RSSI.</li><li><b>Customer Success</b> : pour onboarder les premiers clients.</li><li><b>Marketing</b> : pour générer des leads.</li></ol>"},
{titre:"Equity : BSPCE et stock options",contenu:"<p>En France, les BSPCE (Bons de Souscription de Parts de Créateur d'Entreprise) permettent d'attribuer des parts aux salariés. Avantages :</p><ul><li>Attire les talents malgré des salaires compétitifs.</li><li>Alignement intérêts salarié/fondateur.</li><li>Fiscalité avantageuse.</li></ul><p>Typiquement : 0,1-1% du capital par salarié senior, vesting sur 4 ans (1 an cliff, puis mensuel).</p>"},
{titre:"Culture startup",contenu:"<ul><li><b>Transparence</b> : partager les chiffres, les défis.</li><li><b>Ownership</b> : chacun est responsable.</li><li><b>Move fast</b> : décisions rapides, itérations.</li><li><b>Feedback</b> : continu, direct.</li><li><b>Mission</b> : sens partagé.</li></ul>"},
{titre:"Erreurs de recrutement",contenu:"<ul><li><b>Recruter trop vite</b> : la culture se dilue.</li><li><b>Recruter des profils big corp</b> : trop process, manque d'agilité.</li><li><b>Pas de culture fit</b> : conflits.</li><li><b>Pas d'onboarding</b> : nouveau perdu.</li><li><b>Pas de feedback</b> : turnover.</li></ul>"}
],
why:"Les 10 premiers employés déterminent la startup. Un mauvais recrutement peut tuer une startup.",
bank:"Une banque ne peut pas recruter comme une startup (trop process). Mais elle peut apprendre sur la culture d'agilité.",
glo:"<b>BSPCE</b> : Bons de Souscription. <b>Vesting</b> : acquisition progressive des parts. <b>Cliff</b> : période minimum.",
pr:["Définir les 5 premiers rôles","Structurer un plan equity","Faire un process de recrutement","Onboarding structuré"],
er:"Recruter sans culture fit = turnover rapide.",
df:"Concevoir un plan de recrutement pour une startup cyber de 10 personnes.",
proj:"Publier un 'Startup Hiring Plan' sur GitHub.",
q:[{q:"BSPCE :",a:["Bons de Souscription","Rien","Rien","Rien"],c:0,e:"BSPCE = Bons de Souscription de Parts de Créateur d'Entreprise."},{q:"Vesting 4 ans :",a:["Acquisition progressive","Rien","Rien","Rien"],c:0,e:"Vesting = acquisition progressive des parts sur 4 ans."}]},

{id:406,t:"Go-to-market cyber",d:50,
intro:"Le go-to-market (GTM) est la stratégie pour atteindre les clients : canaux, prix, ventes, marketing. En cyber, les cycles de vente sont longs (6-18 mois), les décideurs multiples (RSSI, CTO, DAF, DG), et la confiance critique. Un bon GTM est essentiel pour transformer un bon produit en succès commercial.",
analogy:"Vous avez construit un excellent restaurant (produit). Maintenant il faut attirer les clients : emplacement (canaux), menu (prix), service (vente), publicité (marketing). Sans GTM, même le meilleur restaurant reste vide.",
sections:[
{titre:"Modèles de vente cyber",contenu:"<table><tr><th>Modèle</th><th>Description</th><th>Exemple</th></tr><tr><td><b>PLG</b> (Product-Led Growth)</td><td>Produit se vend tout seul (freemium, essai)</td><td>Snyk, 1Password</td></tr><tr><td><b>SLG</b> (Sales-Led Growth)</td><td>Force de vente directe</td><td>CrowdStrike</td></tr><tr><td><b>MLG</b> (Marketing-Led)</td><td>Content, SEO, webinars</td><td>Beaucoup de startups</td></tr><tr><td><b>Channel</b></td><td>Partenaires, revendeurs</td><td>Solutions enterprise</td></tr></table>"},
{titre:"Cibles décideurs en cyber",contenu:"<ul><li><b>RSSI/CISO</b> : décideur technique, budget sécurité.</li><li><b>CTO/CIO</b> : décideur IT, budget infrastructure.</li><li><b>DAF</b> : budget, ROI.</li><li><b>DG/CEO</b> : décision finale pour gros investissements.</li><li><b>Équipe sécurité</b> : utilisateurs, feedback produit.</li></ul><p>Dans une banque, il faut souvent convaincre 3-5 personnes.</p>"},
{titre:"Canaux marketing cyber",contenu:"<ul><li><b>Content marketing</b> : blog, whitepapers, webinars, podcasts.</li><li><b>SEO</b> : mots-clés cyber.</li><li><b>LinkedIn</b> : posts, ads, networking.</li><li><b>Conférences</b> : Black Hat, RSA, Barbhack, AfricaCIS.</li><li><b>Webinars</b> : démos produit, cas clients.</li><li><b>Cold outreach</b> : emails ciblés.</li><li><b>Partenariats</b> : MSSP, intégrateurs.</li><li><b>Bug bounty</b> : visibilité.</li></ul>"},
{titre:"Pricing models",contenu:"<ul><li><b>Par utilisateur</b> : ex. 20€/user/mois.</li><li><b>Par asset</b> : ex. 5€/endpoint/mois.</li><li><b>Par volume</b> : ex. 1€/GB traité.</li><li><b>Par fonctionnalité</b> : basic/advanced/enterprise.</li><li><b>Usage-based</b> : payez ce que vous consommez.</li><li><b>Enterprise</b> : contrat annuel, custom.</li></ul><p>Le pricing doit être aligné sur la valeur client (ROI).</p>"},
{titre:"Sales process cyber",contenu:"<ol><li><b>Lead</b> : contact entrant ou sortant.</li><li><b>Qualification</b> : budget, autorité, besoin, timing (BANT).</li><li><b>Démo</b> : présentation produit.</li><li><b>POC (Proof of Concept)</b> : test sur 2-4 semaines.</li><li><b>Négociation</b> : prix, contrat.</li><li><b>Signature</b> : 3-18 mois pour un gros client.</li><li><b>Onboarding</b> : déploiement.</li><li><b>Expansion</b> : upsell, cross-sell.</li></ol>"}
],
why:"Le GTM transforme un bon produit en succès commercial. 80% des startups cyber échouent commercialement, pas techniquement.",
bank:"Une banque attend des vendeurs cyber qui comprennent ses contraintes (BCEAO, PCI, conformité). Un GTM adapté = vente réussie.",
glo:"<b>GTM</b> : Go-To-Market. <b>PLG</b> : Product-Led Growth. <b>POC</b> : Proof of Concept. <b>BANT</b> : Budget Authority Need Timing.",
pr:["Définir le modèle de vente","Identifier les décideurs","Créer 5 cas clients","Tester un canal marketing"],
er:"Un mauvais GTM = startup qui échoue malgré un bon produit.",
df:"Concevoir un plan GTM pour une startup cyber ciblant les banques CI.",
proj:"Publier un 'GTM Plan Cyber' sur GitHub.",
q:[{q:"PLG signifie :",a:["Product-Led Growth","Rien","Rien","Rien"],c:0,e:"PLG = Product-Led Growth, le produit se vend seul."},{q:"BANT :",a:["Budget Authority Need Timing","Rien","Rien","Rien"],c:0,e:"BANT = Budget Authority Need Timing, cadre de qualification."}]},

{id:407,t:"Gérer une équipe startup",d:50,
intro:"Gérer une équipe startup est très différent d'une équipe corporate. Peu de process, beaucoup d'incertitude, forte pression. Le manager doit être à la fois coach, exemple, et décideur. Il doit garder l'équipe motivée malgré les défis, et attirer les meilleurs talents.",
analogy:"Un capitaine de navire dans une tempête. Il doit rassurer l'équipage, prendre les bonnes décisions, et garder le cap malgré les vagues.",
sections:[
{titre:"Défis spécifiques",contenu:"<ul><li><b>Incertitude</b> : pivot, changement de stratégie.</li><li><b>Pression</b> : croissance, rentabilité, levée.</li><li><b>Ressources limitées</b> : budget, temps.</li><li><b>Turnover</b> : les talents partent si mal managés.</li><li><b>Multi-tasking</b> : chacun fait plusieurs métiers.</li></ul>"},
{titre:"Bonnes pratiques",contenu:"<ul><li><b>Vision claire</b> : où on va, pourquoi.</li><li><b>Transparence</b> : partager les défis, les chiffres.</li><li><b>Autonomie</b> : faire confiance, ne pas micro-manager.</li><li><b>Feedback continu</b> : hebdomadaire, informel.</li><li><b>Reconnaissance</b> : célébrer les victoires.</li><li><b>Développement</b> : formation, mentorship.</li><li><b>Équilibre</b> : éviter le burnout.</li></ul>"},
{titre:"Rituels startup",contenu:"<ul><li><b>Daily standup</b> : 15 min, blocages.</li><li><b>Weekly sync</b> : 1h, priorités.</li><li><b>Monthly all-hands</b> : 1h, vision, chiffres.</li><li><b>Quarterly offsite</b> : stratégie, team building.</li><li><b>1:1</b> : 30 min/mois par personne.</li></ul>"},
{titre:"Gestion du burnout",contenu:"<p>Le burnout est fréquent en startup cyber. Signes :</p><ul><li>Épuisement, cynisme, inefficacité.</li><li>Isolement, conflits.</li><li>Baisse de performance.</li></ul><p>Prévention :</p><ul><li>Horaires raisonnables.</li><li>Vacances obligatoires.</li><li>Support psychologique (EAP).</li><li>Rotation des tâches.</li><li>Culture blameless.</li></ul>"},
{titre:"Manager startup vs manager corporate",contenu:"<table><tr><th>Aspect</th><th>Startup</th><th>Corporate</th></tr><tr><td>Process</td><td>Peu, itératif</td><td>Structuré</td></tr><tr><td>Décisions</td><td>Rapides</td><td>Lentes</td></tr><tr><td>Autonomie</td><td>Forte</td><td>Limitée</td></tr><tr><td>Risque</td><td>Élevé</td><td>Faible</td></tr><tr><td>Impact</td><td>Direct</td><td>Diffus</td></tr></table>"}
],
why:"Une équipe mal managée = turnover = échec de la startup. Le manager est le facteur #1 de rétention.",
bank:"Une banque peut apprendre des startups pour sa propre agilité (équipes projets, innovation).",
glo:"<b>EAP</b> : Employee Assistance Program. <b>1:1</b> : réunion individuelle.",
pr:["Définir la vision","Mettre en place les rituels","Former les managers","Prévenir burnout"],
er:"Micro-management = turnover immédiat en startup.",
df:"Concevoir un plan de management pour une équipe startup de 10 personnes.",
proj:"Publier un 'Startup Management Playbook' sur GitHub.",
q:[{q:"1:1 :",a:["Réunion individuelle","Rien","Rien","Rien"],c:0,e:"1:1 = réunion individuelle entre manager et collaborateur."},{q:"Burnout :",a:["Épuisement","Rien","Rien","Rien"],c:0,e:"Burnout = épuisement professionnel."}]},

{id:408,t:"Vendre à un RSSI",d:50,
intro:"Vendre à un RSSI/CISO est spécifique : cycles longs, décisions collégiales, exigences techniques, budget contraint. Le vendeur doit comprendre les enjeux du RSSI : conformité (BCEAO, PCI, ISO), risque, budget, ROI, mais aussi la pression du board.",
analogy:"Vendre à un RSSI, c'est comme vendre une assurance à un chef de sécurité. Il ne veut pas juste un produit, il veut une solution qui réduit son risque, respecte la réglementation, et tient face à un audit.",
sections:[
{titre:"Comprendre le RSSI",contenu:"<ul><li><b>Objectifs</b> : réduire le risque, conformité, protéger la réputation.</li><li><b>Contraintes</b> : budget, temps, équipe réduite.</li><li><b>Pression</b> : board, régulateurs, incidents.</li><li><b>Priorités</b> : risques majeurs d'abord.</li><li><b>Méfiance</b> : a vu trop de vendeurs promettre monts et merveilles.</li></ul>"},
{titre:"Arguments qui marchent",contenu:"<ul><li><b>Conformité</b> : 'Cette solution vous aide à respecter BCEAO/PCI.'</li><li><b>Réduction risque</b> : 'Elle détecte X% des attaques.'</li><li><b>ROI</b> : 'Elle coûte Y, économise Z.'</li><li><b>Références</b> : 'La banque A l'utilise avec succès.'</li><li><b>POC</b> : 'Testez-la 30 jours gratuitement.'</li><li><b>Support</b> : 'Nous avons une équipe locale à Abidjan.'</li></ul>"},
{titre:"Cycle de vente",contenu:"<ol><li><b>Contact</b> : LinkedIn, conférence, intro.</li><li><b>Découverte</b> : comprendre les enjeux du RSSI.</li><li><b>Démo</b> : montrer la valeur concrète.</li><li><b>POC</b> : test 2-4 semaines.</li><li><b>Business case</b> : justification au board.</li><li><b>Négociation</b> : prix, contrat.</li><li><b>Signature</b> : souvent 6-18 mois.</li><li><b>Onboarding</b> : déploiement.</li></ol>"},
{titre:"Erreurs de vendeur cyber",contenu:"<ul><li><b>Parler technique au board</b> : le board veut business.</li><li><b>Promettre monts et merveilles</b> : perte de crédibilité.</li><li><b>Ne pas connaître BCEAO</b> : le RSSI le verra.</li><li><b>Pas de POC</b> : le RSSI veut tester.</li><li><b>Prix trop élevé</b> : budget contraint.</li><li><b>Pas de support local</b> : risque pour le RSSI.</li></ul>"},
{titre:"Cas concret : vendre à une banque CI",contenu:"<p>Vous vendez une solution de détection d'anomalies à une banque CI. Arguments :</p><ul><li>Conformité BCEAO : détection intrusion obligatoire.</li><li>Référence : 'Nous protégeons 3 banques en Afrique de l'Ouest.'</li><li>Support local : équipe à Abidjan, support en français.</li><li>ROI : 'Détection 10x plus rapide = économie de X M FCFA.'</li><li>POC : 30 jours gratuits.</li></ul>"}
],
why:"Vendre à un RSSI = transformer un produit en revenus. Comprendre le RSSI = 50% de la vente.",
bank:"Les RSSI bancaires sont des décideurs clés. Un vendeur qui parle leur langue gagne.",
glo:"<b>POC</b> : Proof of Concept. <b>Business case</b> : justification ROI.",
pr:["Étudier un RSSI type","Préparer une démo","Faire un POC","Adapter pitch"],
er:"Un vendeur qui ne connaît pas BCEAO = perte immédiate de crédibilité.",
df:"Préparer un pitch de 10 min pour vendre à un RSSI bancaire.",
proj:"Publier un 'Selling to CISO Guide' sur GitHub.",

{id:409,t:"Partenariats stratégiques",d:45,
intro:"Les partenariats stratégiques permettent d'accélérer la croissance : accès à de nouveaux marchés, technologies complémentaires, clients communs. En cyber, les partenariats avec MSSP, intégrateurs, cloud providers sont cruciaux.",
analogy:"Un partenariat, c'est comme un mariage d'affaires. Chacun apporte quelque chose, et l'union est plus forte que la somme des parties.",
sections:[
{titre:"Types de partenariats",contenu:"<ul><li><b>Technologique</b> : intégration produit (ex: SIEM + EDR).</li><li><b>Commercial</b> : revente, distribution.</li><li><b>Stratégique</b> : co-développement, joint-venture.</li><li><b>Channel</b> : revendeurs, intégrateurs.</li><li><b>OEM</b> : votre produit intégré dans un autre.</li><li><b>Cloud marketplace</b> : AWS, Azure Marketplace.</li></ul>"},
{titre:"Partenariats cyber clés",contenu:"<ul><li><b>MSSP</b> : Managed Security Service Provider.</li><li><b>Intégrateurs</b> : Atos, Capgemini, Sopra.</li><li><b>Cloud providers</b> : AWS, Azure, GCP.</li><li><b>Éditeurs complémentaires</b> : EDR + SIEM.</li><li><b>Distributeurs</b> : Ingram Micro, Tech Data.</li><li><b>Telcos</b> : Orange, MTN.</li></ul>"},
{titre:"Négociation partenariat",contenu:"<ul><li><b>Objectifs communs</b> : qu'est-ce qu'on gagne ?</li><li><b>Scope</b> : qui fait quoi.</li><li><b>Revenus partagés</b> : 70/30, 50/50, commission.</li><li><b>Exclusivité</b> : souvent à éviter.</li><li><b>Durée</b> : 1-3 ans, renouvelable.</li><li><b>Sortie</b> : conditions de fin.</li></ul>"},
{titre:"Programmes partenaires",contenu:"<p>Les grands éditeurs ont des programmes structurés :</p><ul><li><b>Microsoft Partner Network</b> : Gold, Silver.</li><li><b>AWS Partner Network</b> : Advanced, Premier.</li><li><b>Google Cloud Partner</b>.</li><li><b>Palo Alto Networks</b> : NextWave.</li><li><b>CrowdStrike</b> : Elevate.</li></ul><p>Ces programmes apportent : leads, co-marketing, formation, support.</p>"},
{titre:"Exemple concret",contenu:"<p>Une startup cyber CI signe un partenariat avec une banque :</p><ul><li>La banque devient client de référence (logo, témoignage).</li><li>La startup obtient un accès au réseau de la banque.</li><li>La banque obtient un prix préférentiel.</li><li>Co-marketing : articles, conférences.</li><li>Durée : 2 ans, renouvelable.</li></ul>"}
],

df:"Concevoir un plan de partenariats stratégiques pour une startup cyber.",

{id:410,t:"Scaling d'une startup cyber",d:50,
intro:"Scaling = passer d'une startup de 10 personnes à 100+, tout en gardant la culture, la qualité, et la croissance. C'est la phase la plus difficile : les process doivent évoluer, les leaders doivent être formés, la trésorerie doit suivre.",
analogy:"Passer d'un commando de 10 à une armée de 100. La communication, les process, la logistique deviennent critiques. Sans structure, l'armée s'effondre.",
sections:[
{titre:"Défis du scaling",contenu:"<ul><li><b>Communication</b> : à 10, tout le monde sait tout. À 100, il faut des process.</li><li><b>Recrutement</b> : embaucher 5-10 personnes/mois.</li><li><b>Culture</b> : maintenir les valeurs malgré la croissance.</li><li><b>Process</b> : formaliser sans étouffer.</li><li><b>Financement</b> : Series A/B pour financer la croissance.</li><li><b>Internationalisation</b> : nouveaux marchés, langues, régulations.</li></ul>"},
{titre:"Changements clés au scaling",contenu:"<table><tr><th>À 10 personnes</th><th>À 100 personnes</th></tr><tr><td>Communication informelle</td><td>Documentation, meetings</td></tr><tr><td>Décisions rapides</td><td>Process de décision</td></tr><tr><td>Tout le monde fait tout</td><td>Rôles spécialisés</td></tr><tr><td>Manager = chef d'équipe</td><td>Manager = coach, leader</td></tr><tr><td>Vision partagée oralement</td><td>Vision documentée, communiquée</td></tr></table>"},
{titre:"Structure organisationnelle",contenu:"<ul><li><b>Fonctionnelle</b> : par métier (R&D, Sales, Marketing).</li><li><b>Divisions</b> : par produit ou marché.</li><li><b>Matricielle</b> : mixte.</li><li><b>Squads</b> : équipes pluridisciplinaires.</li></ul><p>Chaque modèle a ses avantages. Souvent hybride.</p>"},
{titre:"Financement du scaling",contenu:"<ul><li><b>Series A</b> : 3-15M€. Pour accélérer les ventes.</li><li><b>Series B</b> : 15-50M€. Pour l'internationalisation.</li><li><b>Series C+</b> : 50M€+. Pour dominer le marché.</li><li><b>Revenue-based financing</b> : alternative.</li><li><b>IPO</b> : rare en cyber, sauf très gros (CrowdStrike, SentinelOne).</li></ul>"},
{titre:"Cas célèbres de scaling",contenu:"<ul><li><b>CrowdStrike</b> : créé 2011, IPO 2019, 8000+ employés.</li><li><b>Wiz</b> : créé 2020, vendu 32 milliards $ en 2024. Scaling record.</li><li><b>Snyk</b> : créé 2015, valorisé 7,4 milliards $.</li><li><b>1Password</b> : créé 2006, valorisé 6,8 milliards $.</li></ul>"}

{id:411,t:"Levée de fonds : process complet",d:55,
intro:"La levée de fonds est un processus de 3-6 mois, très prenant. Elle nécessite préparation, réseautage, pitchs, négociations. Un bon process augmente vos chances de succès et limite la dilution.",
analogy:"Une levée de fonds, c'est comme une campagne électorale. Vous devez convaincre des dizaines de personnes, gérer les objections, et finir par gagner.",
sections:[
{titre:"Phases de la levée",contenu:"<ol><li><b>Préparation</b> (1-2 mois) : documents, pitch deck, data room.</li><li><b>Outreach</b> (1 mois) : identifier 50-100 investisseurs.</li><li><b>Pitchs</b> (2-3 mois) : réunions, démos, questions.</li><li><b>Due diligence</b> (1 mois) : audit financier, juridique, technique.</li><li><b>Term sheet</b> : négociation des termes.</li><li><b>Closing</b> : signature, virement.</li></ol>"},
{titre:"Documents nécessaires",contenu:"<ul><li><b>Pitch deck</b> : 10-15 slides.</li><li><b>Business plan</b> : 15-30 pages.</li><li><b>Modèle financier</b> : Excel 3-5 ans.</li><li><b>Data room</b> : statuts, cap table, contrats, propriété intellectuelle.</li><li><b>Due diligence questionnaire</b> : préparé.</li><li><b>Références clients</b> : contacts.</li></ul>"},
{titre:"Term sheet : points clés",contenu:"<ul><li><b>Pre-money / post-money</b> : valorisation avant/après investissement.</li><li><b>Dilution</b> : % du capital cédé.</li><li><b>Liquidation preference</b> : 1x, 2x (les investisseurs se remboursent avant les fondateurs).</li><li><b>Anti-dilution</b> : protection des investisseurs.</li><li><b>Board composition</b> : combien de sièges.</li><li><b>Vesting</b> : acquisition progressive des parts fondateurs.</li><li><b>Drag-along</b> : obligation de vendre si majorité veut.</li></ul>"},
{titre:"Due diligence",contenu:"<p>Les investisseurs vérifient :</p><ul><li><b>Financier</b> : comptes, contrats, dettes.</li><li><b>Juridique</b> : statuts, PI, litiges.</li><li><b>Technique</b> : code, architecture, sécurité.</li><li><b>Commercial</b> : clients, pipeline.</li><li><b>RH</b> : contrats, turnover.</li><li><b>Marché</b> : taille, concurrence.</li></ul>"},
{titre:"Erreurs courantes",contenu:"<ul><li><b>Commencer sans préparation</b> : rejet rapide.</li><li><b>Un seul investisseur en vue</b> : perte de pouvoir de négociation.</li><li><b>Surévaluer sa startup</b> : les investisseurs le verront.</li><li><b>Term sheet signé trop vite</b> : clauses défavorables.</li><li><b>Négliger le closing</b> : retards.</li></ul>"}
],
why:"Une bonne levée = 18-24 mois de runway. Une mauvaise = dilution excessive ou échec.",
bank:"Une banque qui investit (CVC) doit maîtriser ce process pour ne pas se faire piéger.",
glo:"<b>Term sheet</b> : document de termes. <b>Due diligence</b> : audit. <b>Data room</b> : documents.",
pr:["Préparer les documents","Lister 50 investisseurs","Pitcher 20","Négocier"],
er:"Une levée mal préparée = perte de 6 mois.",
df:"Rédiger un plan de levée complet pour une startup cyber.",
proj:"Publier un 'Fundraising Guide' sur GitHub.",
q:[{q:"Term sheet :",a:["Document termes","Rien","Rien","Rien"],c:0,e:"Term sheet = document de termes de la levée."},{q:"Due diligence :",a:["Audit","Rien","Rien","Rien"],c:0,e:"Due diligence = audit approfondi."}]},

{id:412,t:"Sortie : IPO, M&A, ou continuer",d:50,
intro:"Une startup a plusieurs options de sortie : IPO (introduction en bourse), M&A (acquisition), ou continuer en indépendant. Chaque option a ses avantages et inconvénients. Le choix dépend de la vision du fondateur, de la valorisation, et du marché.",
analogy:"Une startup, c'est comme un enfant. Vous pouvez : le laisser grandir (continuer), le marier (M&A), ou le faire entrer dans la haute société (IPO).",
sections:[
{titre:"IPO (Introduction en Bourse)",contenu:"<p>Avantages :</p><ul><li>Valorisation souvent élevée.</li><li>Accès à des capitaux importants.</li><li>Notoriété.</li><li>Liquidité pour les investisseurs.</li></ul><p>Inconvénients :</p><ul><li>Coût (5-10% levée).</li><li>Obligations de reporting.</li><li>Pression court terme.</li><li>Perte de contrôle.</li></ul><p>Exemples cyber : CrowdStrike (2019), SentinelOne (2021), Okta (2017).</p>"},
{titre:"M&A (Acquisition)",contenu:"<p>Avantages :</p><ul><li>Sortie rapide.</li><li>Cash immédiat.</li><li>Intégration dans un grand groupe.</li></ul><p>Inconvénients :</p><ul><li>Valorisation parfois plus basse.</li><li>Perte d'indépendance.</li><li>Culture à fusionner.</li></ul><p>Exemples cyber : Wiz → Google (32Mds$), Mandiant → Google (5,4Mds$), Splunk → Cisco (28Mds$).</p>"},
{titre:"Continuer en indépendant",contenu:"<p>Avantages :</p><ul><li>Indépendance.</li><li>Vision long terme.</li><li>Contrôle total.</li></ul><p>Inconvénients :</p><ul><li>Accès limité aux capitaux.</li><li>Croissance plus lente.</li><li>Pression des investisseurs (si VC).</li></ul><p>Exemples : Veeam, Sophos (avant rachat).</p>"},
{titre:"Valorisation",contenu:"<p>Méthodes courantes :</p><ul><li><b>Multiples de revenus</b> : ARR x 5-15 (cyber = 8-15x).</li><li><b>DCF</b> (Discounted Cash Flow) : projections.</li><li><b>Comparables</b> : transactions récentes.</li><li><b>EBITDA</b> : pour startups rentables.</li></ul>"},
{titre:"Timing",contenu:"<p>Le timing optimal :</p><ul><li>Croissance forte (>100%/an).</li><li>Marché porteur.</li><li>Offre d'achat intéressante.</li><li>Fondateurs prêts (fatigue, vision).</li></ul><p>Ne pas attendre trop (risque de crash de marché) mais ne pas sortir trop tôt (opportunité manquée).</p>"}
],
why:"La sortie détermine le retour pour les fondateurs et investisseurs. Un mauvais timing = perte de valeur.",
bank:"Une banque peut acquérir une startup cyber (M&A) pour internaliser une technologie.",

pr:["Évaluer sa startup","Identifier acheteurs potentiels","Préparer un processus M&A","Négocier"],
er:"Attendre trop = crash marché = valorisation divisée par 5.",
df:"Évaluer la valorisation d'une startup cyber avec 3 méthodes.",
proj:"Publier un 'Exit Strategy Guide' sur GitHub.",
q:[{q:"IPO :",a:["Introduction bourse","Rien","Rien","Rien"],c:0,e:"IPO = Initial Public Offering, introduction en bourse."},{q:"Multiples ARR cyber :",a:["8-15x","1x","100x","Rien"],c:0,e:"Le multiple ARR typique en cyber est 8-15x."}]},

{id:413,t:"Lancer une filiale cyber (banque)",d:55,
intro:"Une banque peut lancer une filiale cyber pour : internaliser une expertise, générer des revenus, ne pas dépendre de fournisseurs externes. C'est ce qu'Orange a fait avec Orange Cyberdefense, ou ce que fait BNP Paribas avec certaines entités.",
analogy:"Une banque qui crée une filiale cyber, c'est comme un restaurant qui crée sa propre école de cuisine. Il internalise une compétence, et peut aussi vendre la formation.",
sections:[
{titre:"Pourquoi créer une filiale cyber ?",contenu:"<ul><li><b>Internaliser</b> l'expertise (SOC, pentest).</li><li><b>Réduire les coûts</b> (externalisation moins chère).</li><li><b>Générer des revenus</b> (vendre à d'autres banques).</li><li><b>Améliorer la conformité</b> (contrôle total).</li><li><b>Attirer les talents</b> (culture startup).</li><li><b>Innover plus vite</b> (agilité).</li></ul>"},
{titre:"Modèles possibles",contenu:"<ul><li><b>Filiale 100%</b> : entité indépendante, la banque finance tout.</li><li><b>Joint-venture</b> : avec un partenaire (Orange + banque).</li><li><b>CVC</b> : investir dans startups, sans les créer.</li><li><b>Acquisition</b> : acheter une startup existante.</li><li><b>Partenariat stratégique</b> : sans créer d'entité.</li></ul>"},
{titre:"Étapes de création",contenu:"<ol><li><b>Business plan</b> : marché, coûts, revenus.</li><li><b>Validation stratégique</b> : board, régulateurs.</li><li><b>Structure juridique</b> : SAS, SA, filiale.</li><li><b>Recrutement CEO</b> : profil entrepreneur.</li><li><b>Constitution équipe</b> : 5-20 personnes.</li><li><b>Lancement</b> : 6-12 mois.</li><li><b>Croissance</b> : clients internes puis externes.</li></ol>"},
{titre:"Défis spécifiques",contenu:"<ul><li><b>Conflit d'intérêts</b> : filiale interne vs fournisseurs.</li><li><b>Culture</b> : banque (process) vs startup (agilité).</li><li><b>Budget</b> : investissement initial.</li><li><b>Régulation</b> : filiale soumise à BCEAO.</li><li><b>Talents</b> : attirer des experts avec salaire banque.</li><li><b>Pilotage</b> : KPI, reporting.</li></ul>"},
{titre:"Cas concrets",contenu:"<ul><li><b>Orange Cyberdefense</b> : filiale d'Orange, leader européen.</li><li><b>BNP Paribas</b> : plusieurs entités cyber internes.</li><li><b>Société Générale</b> : filiales cyber locales.</li><li><b>Mastercard</b> : Cyber & Intelligence Solutions.</li><li><b>Banques CI</b> : parfois internalisent le SOC.</li></ul>"}
],

{id:414,t:"Innovation en startup cyber",d:50,
intro:"L'innovation est vitale pour une startup cyber. Elle peut être technologique (nouvel algorithme, IA), business (nouveau modèle), ou de marché (nouveau segment). Sans innovation, la startup stagne et meurt.",
analogy:"Une startup, c'est comme un requin : soit elle avance, soit elle meurt. L'innovation est son moteur.",
sections:[
{titre:"Sources d'innovation",contenu:"<ul><li><b>Client</b> : écouter les besoins non résolus.</li><li><b>Recherche</b> : laboratoires, universités.</li><li><b>Communauté</b> : open source, bug bounty.</li><li><b>Concurrence</b> : améliorer l'existant.</li><li><b>Interne</b> : R&D, hackathons.</li><li><b>Partenariats</b> : startups, grands groupes.</li></ul>"},
{titre:"Processus d'innovation",contenu:"<ol><li><b>Idéation</b> : brainstorm, veille.</li><li><b>Validation</b> : entretiens clients, POC.</li><li><b>Prototype</b> : MVP en 3-6 mois.</li><li><b>Test</b> : early adopters.</li><li><b>Itération</b> : amélioration continue.</li><li><b>Scale</b> : si traction.</li></ol>"},
{titre:"Exemples d'innovation cyber",contenu:"<ul><li><b>Wiz</b> : agentless cloud security, disruption du marché.</li><li><b>Snyk</b> : sécurité open source, PLG.</li><li><b>1Password</b> : UX passwordless.</li><li><b>CrowdStrike</b> : EDR cloud-native.</li><li><b>Axonius</b> : asset management innovant.</li><li><b>Pentera</b> : pentest automatisé.</li></ul>"},
{titre:"Budget innovation",contenu:"<p>En startup, l'innovation est intégrée :</p><ul><li>10-20% du temps d'ingénierie en R&D.</li><li>Hackathons trimestriels.</li><li>Veille technologique.</li><li>Partenariats universités.</li><li>Budget formation.</li></ul>"},
{titre:"Mesurer l'innovation",contenu:"<ul><li><b>Nombre de brevets</b> (rare en cyber).</li><li><b>Publications</b> (conférences).</li><li><b>Time-to-market</b> de nouveaux produits.</li><li><b>Adoption clients</b>.</li><li><b>NPS</b> (satisfaction).</li><li><b>Revenue des nouveaux produits</b>.</li></ul>"}

{id:415,t:"De la vision à l'exécution",d:55,
intro:"Une vision sans exécution est une hallucination. Une startup cyber doit transformer sa vision en plan concret, jalons, KPI, et livrables. C'est la discipline d'exécution qui différencie les startups qui réussissent de celles qui échouent.",
analogy:"Un architecte peut avoir la plus belle vision du monde, mais sans maçons et sans plan de construction, rien ne se réalise.",
sections:[
{titre:"Du vision au plan",contenu:"<ol><li><b>Vision</b> : où on va, pourquoi (5-10 ans).</li><li><b>Mission</b> : ce qu'on fait au quotidien.</li><li><b>Objectifs</b> : 3-5 objectifs annuels.</li><li><b>OKR</b> : Objectives & Key Results trimestriels.</li><li><b>Jalons</b> : 5-10 jalons mesurables.</li><li><b>Roadmap</b> : 12-24 mois.</li><li><b>Sprints</b> : 2 semaines, itérations.</li></ol>"},
{titre:"OKR (Objectives & Key Results)",contenu:"<p>Cadre utilisé par Google, Intel, startups :</p><ul><li><b>Objective</b> : qualitatif, inspirant. Ex : 'Devenir leader cyber en Afrique de l'Ouest'.</li><li><b>Key Results</b> : quantitatifs, mesurables. Ex : 'Atteindre 50 clients bancaires', 'ARR de 5M€'.</li></ul><p>Trimestriels, 3-5 objectifs, 3-5 KR par objectif.</p>"},
{titre:"Jalons typiques startup cyber",contenu:"<ul><li><b>M1-3</b> : MVP lancé.</li><li><b>M4-6</b> : 3 premiers clients payants.</li><li><b>M7-12</b> : 10 clients, ARR 500k€.</li><li><b>M13-18</b> : Series A levée.</li><li><b>M19-24</b> : 30 clients, ARR 2M€.</li><li><b>M25-36</b> : internationalisation, ARR 5M€.</li></ul>"},
{titre:"Discipline d'exécution",contenu:"<ul><li><b>Focus</b> : 1-2 priorités max.</li><li><b>Cadence</b> : sprints réguliers.</li><li><b>Mesure</b> : KPI hebdomadaires.</li><li><b>Décisions</b> : rapides, data-driven.</li><li><b>Feedback</b> : continu, clients.</li><li><b>Communication</b> : transparente.</li></ul>"},
{titre:"Erreurs d'exécution",contenu:"<ul><li><b>Vision floue</b> : équipe perdue.</li><li><b>Trop de priorités</b> : dispersion.</li><li><b>Pas de mesure</b> : pas d'ajustement.</li><li><b>Décisions lentes</b> : perte d'opportunités.</li><li><b>Ignorer les clients</b> : déconnexion.</li></ul>"}
],

{id:416,t:"Gestion financière startup",d:50,
intro:"La gestion financière est souvent négligée par les fondateurs techniques. Pourtant, une startup qui manque de trésorerie meurt, même avec un bon produit. Il faut maîtriser : burn rate, runway, prévisionnel, marge, unit economics.",
analogy:"Un avion a besoin de carburant pour voler. Une startup a besoin de trésorerie pour exister. Sans runway (carburant), elle s'écrase.",
sections:[
{titre:"Métriques financières clés",contenu:"<ul><li><b>MRR/ARR</b> : revenus récurrents.</li><li><b>Churn</b> : taux d'attrition (clients qui partent).</li><li><b>CAC</b> : coût d'acquisition client.</li><li><b>LTV</b> : lifetime value (revenu total par client).</li><li><b>LTV/CAC</b> : ratio de rentabilité (>3 = sain).</li><li><b>Burn rate</b> : consommation mensuelle de trésorerie.</li><li><b>Runway</b> : mois avant rupture de trésorerie.</li><li><b>Marge brute</b> : revenus - coûts directs.</li></ul>"},
{titre:"Prévisionnel financier",contenu:"<p>3 ans, mois par mois :</p><ul><li><b>Revenus</b> : par produit, par client, croissance.</li><li><b>Coûts</b> : salaires, marketing, cloud, juridique.</li><li><b>Marge brute</b> : revenus - coûts directs.</li><li><b>EBITDA</b> : marge brute - coûts opérationnels.</li><li><b>Trésorerie</b> : solde mois par mois.</li><li><b>Runway</b> : durée avant rupture.</li></ul>"},
{titre:"Unit economics",contenu:"<p>Exemple d'une startup cyber SaaS :</p><ul><li>Prix : 100€/mois/client.</li><li>Churn : 2%/mois.</li><li>Durée moyenne : 1/0.02 = 50 mois.</li><li>LTV : 100 x 50 = 5000€.</li><li>CAC : 2000€.</li><li>LTV/CAC : 5000/2000 = 2.5 (à améliorer).</li></ul><p>Cible : LTV/CAC > 3, payback < 12 mois.</p>"},
{titre:"Gestion de trésorerie",contenu:"<ul><li><b>Budget</b> : mensuel, prévisionnel.</li><li><b>Suivi</b> : hebdomadaire du cash.</li><li><b>Alertes</b> : runway < 6 mois = urgence.</li><li><b>Leviers</b> : réduire coûts, accélérer ventes, lever.</li><li><b>Filet de sécurité</b> : ligne de crédit.</li></ul>"},
{titre:"Outils",contenu:"<ul><li><b>Excel/Sheets</b> : prévisionnel.</li><li><b>Pennylane</b>, <b>Qonto</b> : compta.</li><li><b>Stripe</b>, <b>Paddle</b> : paiements.</li><li><b>ChartMogul</b> : métriques SaaS.</li><li><b>Runway</b> : prévisionnel visuel.</li></ul>"}
],
why:"80% des startups échouent par manque de trésorerie. La gestion financière est vitale.",
bank:"Une banque qui finance une startup (CVC) vérifie ses finances rigoureusement.",
glo:"<b>MRR/ARR</b> : Monthly/Annual Recurring Revenue. <b>CAC/LTV</b> : coût acquisition/lifetime value.",
pr:["Construire un prévisionnel 3 ans","Calculer LTV/CAC","Mettre en place le suivi cash","Définir alertes"],
er:"Ne pas suivre la trésorerie = faillite surprise.",
df:"Construire un prévisionnel financier 3 ans pour une startup cyber.",

{id:417,t:"Branding cyber",d:45,
intro:"Le branding est l'image de marque de votre startup. En cyber, il est crucial : les clients doivent vous faire confiance. Un bon branding différencie, attire les talents, et facilite la vente.",
analogy:"Un bon branding, c'est comme un bon uniforme : il inspire confiance, différencie, et donne une première impression forte.",
sections:[
{titre:"Éléments du branding",contenu:"<ul><li><b>Nom</b> : mémorable, prononçable, disponible (domaine, trademark).</li><li><b>Logo</b> : simple, reconnaissable, professionnel.</li><li><b>Slogan</b> : court, mémorable, différenciant.</li><li><b>Charte</b> : couleurs, typographie, ton.</li><li><b>Site web</b> : clair, professionnel, sécurisé.</li><li><b>Réseaux sociaux</b> : cohérents.</li><li><b>Contenus</b> : blog, whitepapers, conférences.</li></ul>"},
{titre:"Positionnement",contenu:"<p>En cyber, plusieurs positionnements possibles :</p><ul><li><b>Technique</b> : 'experts, pointus' (SANS, Offensive Security).</li><li><b>Accessible</b> : 'simple, pour tous' (1Password).</li><li><b>Premium</b> : 'haut de gamme' (CrowdStrike).</li><li><b>Innovant</b> : 'disruptif' (Wiz).</li><li><b>Local</b> : 'africain, adapté' (startups CI).</li></ul>"},
{titre:"Branding B2B cyber",contenu:"<ul><li><b>Sobriété</b> : pas de design criard.</li><li><b>Confiance</b> : certifications, références.</li><li><b>Expertise</b> : publications, talks, blog.</li><li><b>Transparence</b> : pas de sur-promesse.</li><li><b>Communauté</b> : open source, bug bounty.</li></ul>"},
{titre:"Site web cyber",contenu:"<p>Structure recommandée :</p><ul><li><b>Hero</b> : message clair, valeur, CTA.</li><li><b>Problème/Solution</b> : en quoi vous aidez.</li><li><b>Produit</b> : fonctionnalités, démos.</li><li><b>Clients</b> : logos, témoignages.</li><li><b>Ressources</b> : blog, whitepapers.</li><li><b>Équipe</b> : fondateurs, advisors.</li><li><b>Contact</b> : démo, essai.</li></ul>"},
{titre:"Erreurs de branding",contenu:"<ul><li><b>Nom imprononçable</b> : difficile à mémoriser.</li><li><b>Design amateur</b> : perte de crédibilité.</li><li><b>Slogan générique</b> : pas différenciant.</li><li><b>Promesses exagérées</b> : perte de confiance.</li><li><b>Site peu sécurisé</b> : ironie en cyber.</li><li><b>Absence de contenu</b> : pas d'expertise visible.</li></ul>"}

{id:418,t:"Éthique entrepreneuriale",d:50,
intro:"L'éthique entrepreneuriale est cruciale en cybersécurité. Une startup qui vend de la sécurité doit être irréprochable. Cela inclut : transparence, respect des données clients, sécurité du produit, conformité, responsabilité.",
analogy:"Un médecin qui fume ne peut pas être crédible pour dire d'arrêter. Une startup cyber qui n'est pas elle-même sécurisée ne peut pas vendre de la sécurité.",
sections:[
{titre:"Principes éthiques",contenu:"<ul><li><b>Transparence</b> : pas de promesses exagérées.</li><li><b>Respect données</b> : RGPD, privacy by design.</li><li><b>Sécurité produit</b> : votre solution doit être sécurisée.</li><li><b>Disclosure</b> : responsable disclosure de vulnérabilités.</li><li><b>Anti-corruption</b> : pas de pots-de-vin.</li><li><b>Inclusion</b> : diversité, équité.</li><li><b>Environnement</b> : green IT.</li></ul>"},
{titre:"Sécurité de votre produit",contenu:"<p>Une startup cyber doit :</p><ul><li>Faire auditer son produit (pentest).</li><li>Avoir une politique de sécurité.</li><li>Bug bounty program.</li><li>Certifications (ISO 27001, SOC 2).</li><li>Chiffrement des données.</li><li>MFA obligatoire.</li><li>Disclosure responsable.</li></ul>"},
{titre:"Relation client",contenu:"<ul><li><b>Honnêteté</b> : pas de sur-promesse.</li><li><b>Support</b> : réactif, de qualité.</li><li><b>Prix</b> : transparents.</li><li><b>Contrat</b> : clair, équilibré.</li><li><b>Données</b> : respect strict.</li><li><b>Exit</b> : facilité de sortie.</li></ul>"},
{titre:"Conformité",contenu:"<ul><li><b>RGPD</b> : si clients EU.</li><li><b>ARTCI</b> : si clients CI.</li><li><b>BCEAO</b> : si clients banques CI.</li><li><b>PCI-DSS</b> : si données cartes.</li><li><b>ISO 27001</b> : référence.</li><li><b>SOC 2</b> : exige par clients US.</li></ul>"},
{titre:"Cas célèbres",contenu:"<ul><li><b>SolarWinds</b> : supply chain attack, perte de confiance massive.</li><li><b>Uber</b> : cache d'une breach, amende.</li><li><b>Facebook</b> : Cambridge Analytica, scandale.</li><li><b>Yahoo</b> : cache 2 breaches, prix de vente baissé.</li></ul>"}
],

{id:421,t:"IA générative avancée",d:55,
intro:"L'IA générative (LLM, diffusion models, multimodal) révolutionne la cyber. Les LLM (GPT-4, Claude) peuvent analyser des logs, générer du code, aider au pentest, ou détecter des menaces. Les modèles de diffusion génèrent des images/vidéos (deepfakes). La maîtrise de ces technologies est un avantage stratégique.",
analogy:"L'IA générative, c'est comme avoir un assistant ultra-compétent qui peut analyser, écrire, dessiner, coder. Mais il peut aussi halluciner, mentir, ou être manipulé.",
sections:[
{titre:"Types d'IA génératives",contenu:"<ul><li><b>LLM</b> (Large Language Models) : GPT-4, Claude, Gemini, Llama. Texte, code, raisonnement.</li><li><b>Diffusion models</b> : Stable Diffusion, DALL-E. Images.</li><li><b>Multimodal</b> : GPT-4V, Gemini. Texte + image + audio.</li><li><b>Code generation</b> : Copilot, Cursor. Code.</li><li><b>Speech</b> : Whisper, ElevenLabs. Voix.</li><li><b>Video</b> : Sora. Vidéo.</li></ul>"},
{titre:"Usages défensifs",contenu:"<ul><li><b>Analyse de logs</b> : LLM qui détecte anomalies.</li><li><b>Threat hunting</b> : LLM qui aide à formuler des hypothèses.</li><li><b>Analyse malware</b> : LLM qui explique un binaire.</li><li><b>Rédaction de rapports</b> : LLM qui rédige.</li><li><b>Code review</b> : LLM qui détecte vulnérabilités.</li><li><b>Phishing detection</b> : LLM qui détecte le phishing.</li><li><b>Formation</b> : LLM qui simule un attaquant.</li></ul>"},
{titre:"Usages offensifs",contenu:"<ul><li><b>Phishing personnalisé</b> : LLM qui écrit des emails convaincants.</li><li><b>Deepfakes</b> : voix, vidéo.</li><li><b>Malware</b> : génération de code malveillant.</li><li><b>Reconnaissance</b> : LLM qui analyse OSINT.</li><li><b>Prompt injection</b> : manipulation de LLM.</li><li><b>Vishing</b> : voix synthétique.</li></ul>"},
{titre:"Risques spécifiques",contenu:"<ul><li><b>Prompt injection</b> : instruction cachée qui détourne le LLM.</li><li><b>Jailbreak</b> : contournement des filtres.</li><li><b>Hallucinations</b> : informations fausses.</li><li><b>Data leak</b> : fuite de données via prompt.</li><li><b>Model poisoning</b> : empoisonnement du modèle.</li><li><b>Adversarial inputs</b> : entrées qui trompent le modèle.</li></ul>"},
{titre:"Frameworks de sécurité IA",contenu:"<ul><li><b>OWASP LLM Top 10</b> : risques LLM.</li><li><b>MITRE ATLAS</b> : attaques IA.</li><li><b>NIST AI RMF</b> : gestion du risque IA.</li><li><b>EU AI Act</b> : régulation.</li><li><b>ISO 42001</b> : management IA.</li></ul>"}
],

bank:"Les banques utilisent l'IA générative pour chatbot, analyse, code. Sans sécurité IA, c'est une catastrophe.",
glo:"<b>LLM</b> : Large Language Model. <b>Prompt injection</b> : détournement. <b>ATLAS</b> : framework IA.",

{id:422,t:"Fine-tuning & RAG",d:50,
intro:"Pour spécialiser un LLM en cyber, deux techniques : fine-tuning (réentraîner le modèle sur un corpus spécialisé) et RAG (Retrieval-Augmented Generation, récupérer des documents pertinents avant de générer la réponse). Chacune a ses avantages et inconvénients.",
analogy:"Fine-tuning = former un étudiant dans une discipline spécifique. RAG = donner à l'étudiant une bibliothèque de référence pour répondre.",
sections:[
{titre:"Fine-tuning",contenu:"<p>Réentraîner un modèle (GPT-3.5, Llama) sur un corpus spécialisé (ex: 10 000 rapports de pentest).</p><p><b>Avantages</b> :</p><ul><li>Modèle spécialisé, plus précis.</li><li>Pas besoin de contexte à chaque requête.</li><li>Réponses plus rapides.</li></ul><p><b>Inconvénients</b> :</p><ul><li>Coût (GPU, données).</li><li>Effort de collecte de données.</li><li>Rigide (changement de données = réentraînement).</li></ul>"},
{titre:"RAG (Retrieval-Augmented Generation)",contenu:"<p>Architecture :</p><ol><li>Utilisateur pose une question.</li><li>Le système recherche dans une base de documents (vecteurs).</li><li>Les documents pertinents sont ajoutés au prompt.</li><li>Le LLM génère une réponse basée sur ces documents.</li></ol><p><b>Avantages</b> :</p><ul><li>Pas de réentraînement.</li><li>Données à jour facilement.</li><li>Traçabilité (sources citées).</li></ul><p><b>Inconvénients</b> :</p><ul><li>Dépend de la qualité de la recherche.</li><li>Peut halluciner si documents manquants.</li></ul>"},
{titre:"Cas cyber : RAG pour SOC",contenu:"<p>Un analyste SOC pose une question : 'Comment détecter DCSync ?'</p><ol><li>RAG cherche dans : rapports MITRE, documentation Sigma, articles internes.</li><li>Trouve 5 documents pertinents.</li><li>LLM synthétise : règles Sigma, logs à surveiller, commandes.</li><li>Analyste obtient une réponse avec sources.</li></ol>"},
{titre:"Implémentation RAG",contenu:"<p>Stack :</p><ul><li><b>LLM</b> : GPT-4, Claude, Llama.</li><li><b>Embeddings</b> : OpenAI ada-002, Cohere.</li><li><b>Vector DB</b> : Pinecone, Weaviate, Chroma, Qdrant.</li><li><b>Framework</b> : LangChain, LlamaIndex.</li><li><b>Frontend</b> : chatbot.</li></ul>"},
{titre:"Fine-tuning vs RAG",contenu:"<table><tr><th>Aspect</th><th>Fine-tuning</th><th>RAG</th></tr><tr><td>Coût</td><td>Élevé</td><td>Faible</td></tr><tr><td>Données</td><td>Corpus volume</td><td>Documents</td></tr><tr><td>Mise à jour</td><td>Réentraînement</td><td>Ajout docs</td></tr><tr><td>Traçabilité</td><td>Faible</td><td>Forte</td></tr><tr><td>Usage</td><td>Style, format</td><td>Connaissances</td></tr></table>"}
],

bank:"Un SOC bancaire peut avoir un assistant LLM spécialisé en cyber pour aider les analystes.",

{id:423,t:"IA pour la détection de menaces",d:55,
intro:"L'IA est transformatrice pour la détection de menaces. Les modèles de ML peuvent détecter des anomalies invisibles aux signatures, prédire des attaques, ou classer des alertes. Mais l'IA a des limites : faux positifs, biais, adversarial inputs, besoin de données.",
analogy:"Un détective avec un assistant IA. L'IA traite des millions de données, détecte des motifs, mais c'est le détective qui valide et décide.",
sections:[
{titre:"Techniques d'IA pour la détection",contenu:"<ul><li><b>Anomaly detection</b> : comportement inhabituel (UEBA).</li><li><b>Classification</b> : catégoriser alertes, malware.</li><li><b>Clustering</b> : regrouper menaces similaires.</li><li><b>NLP</b> : analyser logs, emails, phishing.</li><li><b>GNN</b> (Graph Neural Networks) : relations entre entités.</li><li><b>Deep learning</b> : détection avancée.</li><li><b>Reinforcement learning</b> : adaptation continue.</li></ul>"},
{titre:"Modèles spécifiques",contenu:"<ul><li><b>Random Forest</b> : classification phishing, malware.</li><li><b>Autoencoder</b> : détection d'anomalies.</li><li><b>LSTM</b> : analyse séquentielle (logs).</li><li><b>Transformer</b> : NLP (emails, code).</li><li><b>GraphSAGE</b> : analyse graphes (APT detection).</li><li><b>GAN</b> : génération d'attaques pour entraînement.</li></ul>"},
{titre:"Cas d'usage",contenu:"<ul><li><b>Phishing detection</b> : NLP sur emails.</li><li><b>Malware detection</b> : analyse binaire.</li><li><b>UEBA</b> : comportement utilisateur.</li><li><b>Network anomaly</b> : trafic anormal.</li><li><b>Fraud detection</b> : transactions bancaires.</li><li><b>Insider threat</b> : comportement interne.</li></ul>"},
{titre:"Limites de l'IA",contenu:"<ul><li><b>Faux positifs</b> : trop d'alertes = fatigue.</li><li><b>Biais</b> : modèles discriminatoires.</li><li><b>Adversarial</b> : inputs conçus pour tromper.</li><li><b>Explicabilité</b> : black box = difficile à justifier.</li><li><b>Données</b> : besoin de qualité et volume.</li><li><b>Dérive</b> : modèle qui vieillit.</li></ul>"},
{titre:"Métriques d'évaluation",contenu:"<ul><li><b>Precision</b> : % vrais positifs parmi alertes.</li><li><b>Recall</b> : % menaces détectées.</li><li><b>F1-score</b> : harmonique.</li><li><b>FP rate</b> : taux faux positifs.</li><li><b>ROC/AUC</b> : courbe.</li><li><b>Time to detect</b> : temps.</li></ul>"}
],
why:"L'IA détecte ce que les signatures ratent. Indispensable pour SOC moderne.",
bank:"Les SOC bancaires utilisent ML pour détecter APT, fraude, phishing. Sans IA, ils ratent des menaces.",
glo:"<b>UEBA</b> : User Entity Behavior Analytics. <b>Precision/Recall</b> : métriques ML.",
pr:["Entraîner un modèle de phishing detection","Évaluer precision/recall","Déployer en production","Monitorer la dérive"],
er:"Un modèle avec 99% precision mais 20% recall rate 80% des menaces.",

{id:424,t:"IA pour la réponse automatisée",d:50,
intro:"L'IA peut automatiser la réponse aux incidents : enrichissement, priorisation, containment. Le SOAR (Security Orchestration, Automation, Response) intègre de plus en plus d'IA. Résultat : réduction du MTTR, analystes libérés pour tâches complexes.",
analogy:"Un pompier avec un drone qui éteint les petits feux automatiquement. Le pompier se concentre sur les gros incendies.",
sections:[
{titre:"Applications",contenu:"<ul><li><b>Enrichissement</b> : LLM qui analyse contexte.</li><li><b>Classification</b> : prioriser alertes (critique, faux positif).</li><li><b>Containment</b> : isoler machine, bloquer IP automatiquement.</li><li><b>Remédiation</b> : patch, désactivation compte.</li><li><b>Communication</b> : générer rapport incident.</li><li><b>Learning</b> : améliorer avec retours.</li></ul>"},
{titre:"SOAR + IA",contenu:"<p>Playbook SOAR typique avec IA :</p><ol><li>Alerte phishing.</li><li>IA analyse email (NLP).</li><li>IA détecte IOCs (URL, hash).</li><li>IA cherche dans VirusTotal, MISP.</li><li>IA classifie : malveillant ? faux positif ?</li><li>Si malveillant : blocage auto + notification.</li><li>IA génère rapport.</li></ol><p>Résultat : 30 min manuel → 30 s auto.</p>"},
{titre:"Human-in-the-loop",contenu:"<p>L'IA ne doit pas être seule pour :</p><ul><li>Décisions critiques (arrêt prod, sanction).</li><li>Exfiltration suspecte.</li><li>Actions irréversibles.</li><li>Communication clients.</li></ul><p>L'analyste valide avant action.</p>"},
{titre:"Outils",contenu:"<ul><li><b>Splunk SOAR</b> : automation.</li><li><b>Cortex XSOAR</b> : Palo Alto.</li><li><b>Tines</b> : no-code automation.</li><li><b>Shuffle</b> : open source.</li><li><b>Torq</b> : IA-native SOAR.</li><li><b>Dropzone AI</b> : analyste IA autonome.</li></ul>"},
{titre:"Risques",contenu:"<ul><li><b>Faux positifs</b> : actions erronées.</li><li><b>Blocage légitime</b> : arrêt business.</li><li><b>Adversarial</b> : manipulation.</li><li><b>Perte de compétence</b> : analystes dépendants.</li><li><b>Conformité</b> : décisions non justifiées.</li></ul>"}
],
why:"L'automatisation IA réduit MTTR de 90%, libère analystes. Standard moderne.",
bank:"Un SOC bancaire doit automatiser 30-50% des alertes pour survivre. Sans IA, impossible.",
glo:"<b>SOAR</b> : Security Orchestration Automation Response. <b>MTTR</b> : Mean Time to Respond.",
pr:["Playbook SOAR avec IA","Human-in-the-loop","Tester sur lab","Mesurer gain"],
er:"Automatiser sans human-in-the-loop = erreurs critiques.",
df:"Concevoir un playbook SOAR IA pour phishing.",
proj:"Publier un 'SOAR AI Playbook' sur GitHub.",
q:[{q:"SOAR =",a:["Security Orchestration","Rien","Rien","Rien"],c:0,e:"SOAR = Security Orchestration, Automation & Response."},{q:"Human-in-the-loop :",a:["Validation humaine","Rien","Rien","Rien"],c:0,e:"Human-in-the-loop = validation humaine avant action critique."}]},

{id:425,t:"Deepfakes & vishing IA",d:50,
intro:"Les deepfakes (voix, vidéo, image) sont une arme redoutable pour la fraude bancaire. En 2024, un employé d'Arup (Hong Kong) a viré 25M$ après une visioconférence deepfake du CFO. Les vishing (phishing vocal) avec voix IA sont aussi en forte hausse. Comprendre et se défendre contre ces attaques est crucial.",
analogy:"Un deepfake, c'est comme un masque parfait : on croit voir la vraie personne, mais c'est un imposteur. Sans vérification, on tombe dans le piège.",
sections:[
{titre:"Techniques de deepfake",contenu:"<ul><li><b>Voice cloning</b> : quelques secondes d'audio → voix identique.</li><li><b>Face swap</b> : remplacer visage dans vidéo.</li><li><b>Lip sync</b> : synchroniser lèvres avec audio.</li><li><b>Full body deepfake</b> : vidéo entière.</li><li><b>Real-time</b> : visioconférence truquée.</li></ul>"},
{titre:"Cas Arup (2024)",contenu:"<p>Un employé de la firme d'ingénierie Arup (Hong Kong) :</p><ul><li>Reçoit un mail suspect (mais crédible).</li><li>Participe à une visioconférence.</li><li>Voit et entend le CFO et d'autres collègues (deepfakes).</li><li>Reçoit instruction de virer 25M$ (conversion secrète).</li><li>Effectue 15 virements.</li><li>Découvre la fraude une semaine plus tard.</li></ul><p>Leçon : même les employés formés tombent.</p>"},
{titre:"Défenses",contenu:"<ul><li><b>Vérification multi-canaux</b> : rappeler la personne sur un autre canal.</li><li><b>Mot de passe de sécurité</b> : mot secret partagé (à ne jamais dire en visio).</li><li><b>Procédure de validation</b> : 2 personnes pour virements importants.</li><li><b>Détection IA</b> : outils (Reality Defender, Deepware).</li><li><b>Formation</b> : sensibiliser les employés.</li><li><b>Biométrie comportementale</b> : détecter les fraudes.</li></ul>"},
{titre:"Vishing IA",contenu:"<p>Phishing vocal avec voix IA :</p><ul><li>Appel d'un 'PDG' demandant virement urgent.</li><li>Voix identique (clonée).</li><li>Contexte crédible (voyage, urgence).</li></ul><p>Défenses : mêmes que deepfake.</p>"},
{titre:"Régulation",contenu:"<ul><li><b>EU AI Act</b> : transparence sur contenus IA.</li><li><b>Interdiction</b> : deepfakes sans consentement.</li><li><b>Watermarking</b> : marquer les contenus IA.</li><li><b>France</b> : loi contre la manipulation de l'information.</li></ul>"}
],
why:"Les deepfakes sont déjà utilisés pour voler des millions. Ignorer = catastrophe.",
bank:"Une banque doit former ses employés et mettre en place des procédures anti-deepfake.",
glo:"<b>Deepfake</b> : contenu falsifié IA. <b>Vishing</b> : phishing vocal.",
pr:["Regarder des deepfakes récents","Tester détection IA","Former les employés","Procédure validation"],
er:"Faire confiance à une visio sans vérification = fraude possible.",
df:"Concevoir un plan anti-deepfake pour une banque.",
proj:"Publier un 'Deepfake Defense Playbook' sur GitHub.",
q:[{q:"Arup a perdu :",a:["25M$","Rien","Rien","Rien"],c:0,e:"Arup a perdu 25M$ dans un deepfake en 2024."},{q:"Défense :",a:["Multi-canal","Rien","Rien","Rien"],c:0,e:"Vérification multi-canaux = défense clé."}]},

{id:426,t:"IA adversarial",d:55,
intro:"L'IA adversariale étudie comment tromper les modèles ML. Une image légèrement modifiée (imperceptible pour l'humain) peut être classée comme autre chose par le modèle. Une entrée conçue peut faire dire n'importe quoi à un LLM. Comprendre ces attaques est essentiel pour la défense.",
analogy:"Un caméléon qui imite un mur pour tromper les prédateurs. Les adversarial inputs sont les caméléons de l'IA.",
sections:[
{titre:"Attaques sur modèles ML",contenu:"<ul><li><b>FGSM</b> (Fast Gradient Sign Method) : perturbation.</li><li><b>PGD</b> (Projected Gradient Descent) : attaque itérative.</li><li><b>C&W</b> (Carlini & Wagner) : minimale.</li><li><b>DeepFool</b> : perturbation minimale.</li><li><b>Membership inference</b> : deviner si donnée dans training.</li><li><b>Model stealing</b> : copier modèle.</li><li><b>Backdoor</b> : trigger caché.</li></ul>"},
{titre:"Attaques sur LLM",contenu:"<ul><li><b>Prompt injection</b> : instruction cachée.</li><li><b>Jailbreak</b> : contourner les filtres.</li><li><b>Adversarial suffix</b> : caractères qui trompent.</li><li><b>Data poisoning</b> : empoisonner training.</li><li><b>Model extraction</b> : voler modèle.</li><li><b>Membership inference</b> : PII leak.</li></ul>"},
{titre:"Défenses",contenu:"<ul><li><b>Adversarial training</b> : entraîner sur attaques.</li><li><b>Input sanitization</b> : filtrer entrées.</li><li><b>Detection</b> : détecter attaques.</li><li><b>Ensemble</b> : combiner modèles.</li><li><b>Certified defenses</b> : garanties.</li><li><b>Prompt guard</b> : filtres LLM.</li></ul>"},
{titre:"Cas cyber",contenu:"<p>Un attaquant peut :</p><ul><li>Faire passer un malware pour légitime (adversarial).</li><li>Faire dire à un LLM d'ignorer ses instructions (prompt injection).</li><li>Extraire des données d'entraînement (inversion).</li><li>Empoisonner un détecteur de phishing pour whitelister son domaine.</li></ul>"},
{titre:"Outils",contenu:"<ul><li><b>CleverHans</b> : library attaques.</li><li><b>Foolbox</b> : library.</li><li><b>Adversarial Robustness Toolbox</b> (IBM).</li><li><b>Garak</b> : test LLM.</li><li><b>PromptBench</b> : test prompts.</li></ul>"}
],
why:"Un modèle IA mal protégé peut être trompé, volé, ou empoisonné. Critique pour la sécurité.",
bank:"Une IA de détection fraude mal protégée = fraude non détectée.",
glo:"<b>Adversarial</b> : conçu pour tromper. <b>Prompt injection</b> : détournement.",
pr:["Tester FGSM sur un modèle","Tester prompt injection","Implémenter défenses","Évaluer"],
er:"Un modèle non testé peut être trompé facilement.",
df:"Tester un modèle ML de détection phishing en adversarial.",
proj:"Publier un 'Adversarial AI Test Suite' sur GitHub.",
q:[{q:"FGSM :",a:["Attaque adversariale","Rien","Rien","Rien"],c:0,e:"FGSM = Fast Gradient Sign Method."},{q:"Prompt injection :",a:["Détournement","Rien","Rien","Rien"],c:0,e:"Prompt injection = détournement de LLM."}]},

{id:427,t:"Recherche en sécurité IA",d:50,
intro:"La recherche en sécurité IA est en pleine effervescence. Nouveaux attaques, nouvelles défenses, nouveaux frameworks. Les entreprises de pointe (Anthropic, OpenAI, DeepMind, Google) investissent massivement. Publier de la recherche est un moyen de se démarquer.",

sections:[
{titre:"Axes de recherche",contenu:"<ul><li><b>Robustesse</b> : résister aux attaques.</li><li><b>Interprétabilité</b> : comprendre les modèles.</li><li><b>Fairness</b> : éliminer les biais.</li><li><b>Privacy</b> : préserver les données.</li><li><b>Alignment</b> : aligner IA sur valeurs humaines.</li><li><b>Evaluation</b> : benchmarks.</li><li><b>Défense</b> : contre attaques.</li></ul>"},

{id:428,t:"IA pour le pentest",d:50,
intro:"L'IA révolutionne le pentest : reconnaissance automatisée, exploitation guidée, génération de payloads, analyse de vulnérabilités. Mais l'IA ne remplace pas l'expertise : elle accélère le pentester, elle ne le remplace pas.",
analogy:"Un pentester avec un copilote IA. L'IA suggère des attaques, l'humain décide et exécute.",
sections:[
{titre:"Applications",contenu:"<ul><li><b>Recon</b> : analyse OSINT, génération de mots-clés.</li><li><b>Enum</b> : suggestions d'endpoints.</li><li><b>Exploit</b> : génération de payloads.</li><li><b>Fuzzing</b> : inputs intelligents.</li><li><b>Analyse</b> : lecture de code, vulnerabilities.</li><li><b>Rapport</b> : rédaction automatique.</li></ul>"},
{titre:"Outils IA pour pentest",contenu:"<ul><li><b>PentestGPT</b> : LLM pour pentest.</li><li><b>Burp AI</b> : extension IA dans Burp.</li><li><b>XBOW</b> : pentest autonome IA.</li><li><b>Copilot for Security</b> (Microsoft).</li><li><b>Nuclei GPT</b> : templates IA.</li><li><b>HackerAI</b> : assistant pentest.</li></ul>"},
{titre:"Cas concrets",contenu:"<p>Un pentester utilise GPT-4 pour :</p><ul><li>Analyser un fichier JS obfusqué.</li><li>Générer des payloads SQLi contextuels.</li><li>Suggérer des attaques basées sur la stack détectée.</li><li>Rédiger un rapport structuré.</li><li>Expliquer un exploit complexe.</li></ul>"},
{titre:"Limites",contenu:"<ul><li><b>Hallucinations</b> : payloads inexistants.</li><li><b>Pas de contexte réel</b> : pas d'accès au système cible.</li><li><b>Ethique</b> : usage en dehors du scope = illégal.</li><li><b>Faux positifs</b> : suggestions non applicables.</li></ul>"},
{titre:"XBOW",contenu:"<p>XBOW est un pentester autonome IA. Résultats :</p><ul><li>Top 1% sur HackerOne (2025).</li><li>Détecte des vulnérabilités réelles.</li><li>Utilise LLM + outils.</li><li>Mais : ne remplace pas le pentester humain.</li></ul>"}

{id:429,t:"IA pour la gestion des identités",d:45,
intro:"L'IA transforme l'IAM : détection d'anomalies d'accès, authentification continue, gestion des identités machines. Un système IAM traditionnel vérifie au login ; l'IA vérifie en continu et détecte les comportements suspects.",
analogy:"Un vigile qui vous reconnaît à chaque passage et remarque si vous agissez bizarrement, vs un vigile qui vérifie juste votre badge à l'entrée.",
sections:[
{titre:"Applications IAM + IA",contenu:"<ul><li><b>Authentification continue</b> : comportement, biométrie.</li><li><b>Détection anomalies</b> : accès inhabituels.</li><li><b>Risk scoring</b> : score de risque par session.</li><li><b>Fraude interne</b> : comportement employé.</li><li><b>Gestion identités machines</b> : IoT, services.</li><li><b>Provisioning intelligent</b> : droits adaptés.</li></ul>"},
{titre:"Authentification continue",contenu:"<p>Signaux analysés en continu :</p><ul><li><b>Biométrie comportementale</b> : frappe, souris, démarche.</li><li><b>Localisation</b> : géolocalisation anormale.</li><li><b>Appareil</b> : nouveau device, jailbreak.</li><li><b>Horaires</b> : 3h du matin = suspect.</li><li><b>Comportement applicatif</b> : requêtes anormales.</li></ul>"},
{titre:"Outils",contenu:"<ul><li><b>BioCatch</b> : biométrie comportementale.</li><li><b>BehavioSec</b> : idem.</li><li><b>Microsoft Defender for Identity</b> : anomalies AD.</li><li><b>CyberArk</b> : PAM avec IA.</li><li><b>Okta AI</b> : risk scoring.</li><li><b>Silverfort</b> : MFA continu.</li></ul>"},
{titre:"Cas bancaire",contenu:"<p>Une banque détecte une fraude car :</p><ul><li>Le client habituel se connecte à 14h, là c'est 3h.</li><li>Sa frappe est différente.</li><li>L'appareil est nouveau.</li><li>La localisation est à l'étranger.</li><li>Il tente un virement gros montant.</li></ul><p>Score de risque élevé → blocage + vérification.</p>"},

{id:441,t:"Publier une recherche",d:50,
intro:"Publier de la recherche en cybersécurité permet : partager des connaissances, se faire connaître, contribuer à la communauté, et parfois lancer une carrière académique ou d'expert. Les meilleures publications sont rigoureuses, originales, et utiles.",
analogy:"Publier, c'est comme écrire un livre. Vous partagez votre savoir, vous êtes lu, cité, reconnu.",
sections:[
{titre:"Types de publications",contenu:"<ul><li><b>Paper académique</b> : peer-reviewed (USENIX, IEEE S&P, CCS).</li><li><b>Article de blog</b> : rapide, moins formel.</li><li><b>Whitepaper</b> : technique, éditeur.</li><li><b>Talk conférence</b> : Black Hat, DEF CON, Barbhack.</li><li><b>CTF write-up</b> : résolution de challenge.</li><li><b>CVE</b> : divulgation de vulnérabilité.</li><li><b>Outil open source</b> : GitHub.</li></ul>"},
{titre:"Structure d'un paper",contenu:"<ol><li><b>Abstract</b> : résumé 200 mots.</li><li><b>Introduction</b> : contexte, problème.</li><li><b>État de l'art</b> : travaux existants.</li><li><b>Méthodologie</b> : approche.</li><li><b>Résultats</b> : expériences.</li><li><b>Discussion</b> : limites, menaces.</li><li><b>Related work</b> : autres travaux.</li><li><b>Conclusion</b> : synthèse.</li><li><b>Références</b>.</li></ol>"},
{titre:"Conférences cyber majeures",contenu:"<ul><li><b>USENIX Security</b> : top académique.</li><li><b>IEEE S&P</b> : idem.</li><li><b>ACM CCS</b> : idem.</li><li><b>NDSS</b> : idem.</li><li><b>Black Hat</b> : industrie.</li><li><b>DEF CON</b> : hacker.</li><li><b>RSA Conference</b> : commercial.</li><li><b>Barbhack</b> : France.</li><li><b>AfricaCIS</b> : Afrique.</li></ul>"},
{titre:"Processus de publication",contenu:"<ol><li><b>Idée</b> : sujet, contribution.</li><li><b>Recherche</b> : littérature, expériences.</li><li><b>Rédaction</b> : paper, 10-15 pages.</li><li><b>Soumission</b> : deadline, format.</li><li><b>Peer review</b> : 3-5 reviewers.</li><li><b>Acceptation</b> : 15-25% des soumissions.</li><li><b>Révisions</b> : si minor/major revision.</li><li><b>Publication</b> : proceedings.</li><li><b>Présentation</b> : conférence.</li></ol>"},

{id:442,t:"CVE discovery",d:55,
intro:"Découvrir une CVE (Common Vulnerabilities and Exposures) est un moyen puissant de se faire connaître et de contribuer à la sécurité. Les chercheurs qui découvrent des CVE majeures deviennent références. C'est un processus rigoureux : découverte, disclosure responsable, attribution, publication.",
analogy:"Trouver une faille dans un système, c'est comme trouver une porte dérobée dans un château. Il faut la signaler au propriétaire (disclosure), puis au public (CVE).",
sections:[
{titre:"Processus de découverte",contenu:"<ol><li><b>Recon</b> : cible, scope.</li><li><b>Fuzzing</b> : outils automatisés.</li><li><b>Code review</b> : analyse manuelle.</li><li><b>Exploitation</b> : PoC de la vulnérabilité.</li><li><b>Impact</b> : CVSS, portée.</li><li><b>Disclosure responsable</b> : vendeur.</li><li><b>CVE</b> : MITRE, NVD.</li><li><b>Publication</b> : blog, conf.</li></ol>"},
{titre:"Responsible disclosure",contenu:"<p>Règles :</p><ul><li>Informer le vendeur AVANT publication.</li><li>Laisser un délai raisonnable (90 jours).</li><li>Coordonner la divulgation.</li><li>Ne pas exploiter malicieusement.</li><li>Ne pas revendre sans autorisation.</li></ul><p>Programmes :</p><ul><li><b>ZDI</b> (Zero Day Initiative) : rachète les vulns.</li><li><b>Bug bounty</b> : HackerOne, Bugcrowd.</li><li><b>CVDC</b> (CERT/CC) : coordonne.</li><li><b>ANSSI</b> : côté France.</li></ul>"},
{titre:"Attribution CVE",contenu:"<p>Une CVE est attribuée par :</p><ul><li><b>MITRE</b> : autorité CVE.</li><li><b>CNAs</b> (CVE Numbering Authorities) : éditeurs, CERTs.</li><li><b>NVD</b> : base de données NIST.</li></ul><p>Format : CVE-YYYY-NNNNN. Ex: CVE-2021-44228 (Log4Shell).</p>"},
{titre:"CVSS scoring",contenu:"<p>CVSS = Common Vulnerability Scoring System :</p><ul><li><b>Base score</b> : 0-10 (intrinsèque).</li><li><b>Temporal</b> : évolue avec le temps.</li><li><b>Environmental</b> : spécifique au contexte.</li><li><b>Critical</b> : 9.0-10.0.</li><li><b>High</b> : 7.0-8.9.</li><li><b>Medium</b> : 4.0-6.9.</li><li><b>Low</b> : 0.1-3.9.</li></ul>"},
{titre:"Cas célèbres",contenu:"<ul><li><b>Log4Shell</b> (CVE-2021-44228) : CVSS 10.0, RCE dans Log4j.</li><li><b>Heartbleed</b> (CVE-2014-0160) : fuite mémoire OpenSSL.</li><li><b>EternalBlue</b> (CVE-2017-0144) : SMB Windows, utilisé par WannaCry.</li><li><b>Spring4Shell</b> (CVE-2022-22965) : RCE Spring.</li><li><b>xz backdoor</b> (CVE-2024-3094) : supply chain.</li></ul>"}
],
why:"Découvrir des CVE = reconnaissance + contribution. Un chercheur avec 10 CVEs = expert reconnu.",
bank:"Une banque peut avoir un programme de bug bounty (CVE discovery via chercheurs).",
glo:"<b>CVE</b> : Common Vulnerabilities. <b>CVSS</b> : scoring. <b>ZDI</b> : Zero Day Initiative.",
pr:["Choisir une cible","Fuzzer ou reviewer","Trouver une vuln","Disclosure responsable","Demander CVE"],
er:"Publier sans disclosure = illégal + réputation détruite.",
df:"Trouver une CVE dans un logiciel open source (via programme).",
proj:"Publier un write-up CVE sur GitHub.",

{id:443,t:"Bug bounty avancé",d:50,
intro:"Le bug bounty est la pratique de récompenser les chercheurs qui trouvent des vulnérabilités. HackerOne, Bugcrowd, YesWeHack, Intigriti sont les plateformes majeures. Certains chercheurs gagnent 500k$/an, d'autres démarrent à 100$. C'est un marché en forte croissance.",
analogy:"Un chasseur de primes dans le Far West. Trouve les failles, reçois une prime. Plus la faille est critique, plus la prime est élevée.",
sections:[
{titre:"Plateformes",contenu:"<ul><li><b>HackerOne</b> : leader mondial.</li><li><b>Bugcrowd</b> : alternative.</li><li><b>YesWeHack</b> : France/Europe.</li><li><b>Intigriti</b> : Europe.</li><li><b>Synack</b> : enterprise.</li><li><b>Open Bug Bounty</b> : gratuit.</li></ul>"},
{titre:"Programmes célèbres",contenu:"<ul><li><b>Google VRP</b> : jusqu'à 151k$.</li><li><b>Microsoft</b> : jusqu'à 250k$.</li><li><b>Apple</b> : jusqu'à 2M$.</li><li><b>Zoom</b> : jusqu'à 250k$.</li><li><b>GitHub</b> : jusqu'à 30k$.</li><li><b>Shopify</b> : jusqu'à 50k$.</li></ul>"},

{titre:"Stratégies",contenu:"<ul><li><b>Choisir un programme</b> : scope large, prime élevée.</li><li><b>Spécialisation</b> : web, mobile, API, cloud.</li><li><b>Reconnaissance approfondie</b> : subdomains, old code.</li><li><b>Automatisation</b> : outils, scripts.</li><li><b>Patience</b> : 1 vuln = 1-10 jours.</li><li><b>Documentation</b> : write-up clair.</li></ul>"},
{titre:"Risques",contenu:"<ul><li><b>Hors scope</b> : illégal.</li><li><b>Doublon</b> : pas de prime.</li><li><b>Burnout</b> : concurrence.</li><li><b>Délais</b> : paiement lent.</li><li><b>Litiges</b> : prime refusée.</li></ul>"}

{id:446,t:"Brevet en cyber",d:50,
intro:"Les brevets protègent les innovations techniques. En cyber, ils sont utilisés par les grandes entreprises (IBM, Microsoft) et certaines startups. Le processus est long (2-5 ans) et coûteux (10-30k€), mais apporte : protection, valorisation, crédibilité.",
